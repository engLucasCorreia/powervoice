# Builds the Linux packages (AppImage + .deb) and publishes them as a GitHub pre-release when a
# `v*` tag is pushed (or on a manual run). The plugin sandbox (`powervoice-sandbox`) is built
# first and bundled next to the app as a Tauri external binary; the app looks for it beside its
# own executable (vox_plugin_host::SandboxOptions::beside_current_exe). H-45: `just build` does
# the same locally, through the same scripts/packaging/{build_sandbox,tauri_build}.sh — one
# source of truth for how the sandbox gets staged and bundled.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf \
            pkg-config libpipewire-0.3-dev libspa-0.2-dev libjack-jackd2-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build the plugin sandbox
        run: scripts/packaging/build_sandbox.sh

      - name: Build AppImage and .deb
        run: scripts/packaging/tauri_build.sh --bundles appimage,deb

      - name: Verify the sandbox is bundled
        run: python3 scripts/packaging/check_bundle.py

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

      - name: Keep the packages (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: powervoice-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
