# Builds the Linux packages (AppImage + .deb) and publishes them as a GitHub pre-release when a
# `v*` tag is pushed (or on a manual run). The plugin sandbox (`powervoice-sandbox`) is built
# first and bundled next to the app as a Tauri external binary; the app looks for it beside its
# own executable (vox_plugin_host::SandboxOptions::beside_current_exe). Local `just build` doesn't
# bundle it yet — see tickets/BOARD.md H-45.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build the plugin sandbox
        run: |
          cargo build --release -p powervoice-sandbox
          mkdir -p src-tauri/binaries
          cp target/release/powervoice-sandbox \
            src-tauri/binaries/powervoice-sandbox-x86_64-unknown-linux-gnu

      - name: Build AppImage and .deb
        run: >
          npm --prefix ui run tauri build -- --bundles appimage,deb
          --config '{"bundle":{"externalBin":["binaries/powervoice-sandbox"]}}'

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

      - name: Keep the packages (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: powervoice-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
