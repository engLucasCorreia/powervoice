[workspace]
resolver = "3"
members = [
    "crates/module-api",
    "crates/dsp",
    "crates/modules",
    "crates/rack",
    "crates/presets",
    "crates/engine",
    "crates/io",
    "crates/project",
    "crates/testkit",
    "crates/cli",
    "crates/sandbox-ipc",
    "crates/plugin-host",
    "crates/sandbox",
    "crates/clap-abi",
    "crates/test-clap",
    "crates/test-vst3",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
cast_lossless = "warn"
float_cmp = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
hound = "3.5"
ebur128 = { version = "0.1", features = ["precision-true-peak"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: exact f64 parsing, so sidecar/preset states round-trip bit-exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
# No default features: `disable_release` conflicts with `warn_release` (compile_error!).
assert_no_alloc = { version = "1.1.2", default-features = false }
# T-102
cpal = "0.18"
# T-101: session store (ADR-004). memmap2 only in vox-project (ADR-001 §3); libc for unix preallocation.
memmap2 = "0.9"
crc32fast = "1"
libc = "0.2"
# A-010: Windows counterpart of `libc::statvfs` (`vox-project::disk`), already in the dependency
# tree via tauri/cpal.
windows-sys = "0.61"
# T-103: lock-free SPSC rings between the rack host (control thread) and the live rack (audio thread).
rtrb = "0.4"
# S1-01: document → device rate conversion in the playback reader (ADR-002 §5); only in vox-dsp.
rubato = "5"
# S3-04: real FFT for the spectral noise reducer (vox-dsp only; SPEC-014 §4.9, docs/references.md).
realfft = "3.5"
# S4-02: FLAC export encoder (ADR-007), `io` only.
flacenc = "0.5"
# S4-02: runtime-loaded LAME MP3 encoder (ADR-007 §4, D-013), `io` only.
libloading = "0.9"
# T-202: import decode (ADR-007 §3, Amendment 2) — MPL-2.0, `io` only. `default-features = false`:
# only the codecs SPEC-005 §2.2 supports are enabled.
symphonia = { version = "0.6.1", default-features = false, features = [
    "wav",
    "pcm",
    "flac",
    "ogg",
    "vorbis",
    "mp3",
    "isomp4",
    "aac",
] }
# T-806 (ADR-007 §6, ADR-008 Amendment 6): VST3 hosting — coupler-rs bindings generated from the
# MIT VST 3 SDK 3.8.0 headers (MIT OR Apache-2.0; never `vst3-sys`, GPL). Only `powervoice-sandbox`
# and the in-repo test plugin link it.
vst3 = "0.3.0"
