[workspace]
resolver = "3"
members = [
    "crates/module-api",
    "crates/dsp",
    "crates/modules",
    "crates/rack",
    "crates/engine",
    "crates/io",
    "crates/project",
    "crates/testkit",
    "crates/cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
cast_lossless = "warn"
float_cmp = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
hound = "3.5"
ebur128 = { version = "0.1", features = ["precision-true-peak"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: exact f64 parsing, so sidecar/preset states round-trip bit-exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
# No default features: `disable_release` conflicts with `warn_release` (compile_error!).
assert_no_alloc = { version = "1.1.2", default-features = false }
# T-102
cpal = "0.18"
# T-101: session store (ADR-004). memmap2 only in vox-project (ADR-001 §3); libc for unix preallocation.
memmap2 = "0.9"
crc32fast = "1"
libc = "0.2"
# T-103: lock-free SPSC rings between the rack host (control thread) and the live rack (audio thread).
rtrb = "0.4"
# S1-01: document → device rate conversion in the playback reader (ADR-002 §5); only in vox-dsp.
rubato = "5"
