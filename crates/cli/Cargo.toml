[package]
name = "powervoice-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "powervoice-cli"

[[bin]]
name = "powervoice-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
vox-testkit = { path = "../testkit" }
vox-rack = { path = "../rack" }
vox-modules = { path = "../modules" }
# S4-02: `convert` reads/writes through the production encoders and offline resampler.
vox-io = { path = "../io" }
vox-dsp = { path = "../dsp" }
# T-805: the `voxmod` packer (`just voxmod <crate>`) writes `.voxmod` packages with the same code
# "Install module…" reads them with.
vox-plugin-host = { path = "../plugin-host" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[lints]
workspace = true
