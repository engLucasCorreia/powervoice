[package]
name = "vox-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# S1-01: fixed-ratio FFT resampler for the playback reader (ADR-002 §5, ADR-001 §3: rubato only here).
rubato.workspace = true
# S3-04
realfft.workspace = true
thiserror.workspace = true
# S4-01: BS.1770/EBU R128 loudness measurement (production; `precision-true-peak` for 4x
# oversampled true peak, MEMORY.md gotcha). `vox-testkit` wraps the same crate independently as
# its own reference (ADR-001 §3).
ebur128.workspace = true

[dev-dependencies]
# S4-01: cross-checking `loudness::measure` against known BS.1770 reference values (docs/references.md).
vox-testkit = { path = "../testkit" }
# T-110: loudness/resample/spectrogram throughput benches.
divan.workspace = true

# T-110: LUFS/true-peak measurement throughput.
[[bench]]
name = "loudness"
harness = false

# T-110: document -> device rate resampler throughput.
[[bench]]
name = "resample"
harness = false

# T-110: spectrogram tile FFT-frame compute cost.
[[bench]]
name = "spectro"
harness = false

[lints]
workspace = true
