[package]
name = "vox-modules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vox-module-api = { path = "../module-api" }
vox-dsp = { path = "../dsp" }

[dev-dependencies]
vox-module-api = { path = "../module-api", features = ["test-util"] }
vox-testkit = { path = "../testkit" }
serde_json.workspace = true
# T-110: per-module `process()` cost benches (`benches/process_cost.rs`).
divan.workspace = true

# SPEC-017 AC-17: `just bench` (plain `main`, no bench framework dependency).
[[bench]]
name = "true_peak_limiter"
harness = false

# T-110: per-module process() cost, 64..1024-frame blocks (divan + a BENCH_RESULT report pass).
[[bench]]
name = "process_cost"
harness = false

# T-704: the per-module CPU budgets the specs name (SPEC-013 AC-17, SPEC-014 AC-18, SPEC-015 AC-22,
# SPEC-016 AC-19) as BENCH_RESULT pass/fail lines.
[[bench]]
name = "spec_budgets"
harness = false

[lints]
workspace = true
