[package]
name = "vox-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# T-802 (ADR-008 + Amendment 2): the editor side of the plugin sandbox — the `ProxyModule`
# (ADR-005 Module over T-801's `HostEnd`), its factory, the control-channel client, and the
# watchdog/spawner thread. Links no plugin format code (that lives in `powervoice-sandbox`).

[dependencies]
vox-module-api = { path = "../module-api" }
vox-sandbox-ipc = { path = "../sandbox-ipc" }
# T-804: `PluginCatalog::observe`/`upsert` hot-adds newly found plugins into the live rack's
# module registry (ADR-008 §6 Amendment 4) — no cycle: `vox-rack` doesn't depend on this crate.
vox-rack = { path = "../rack" }
# H-44 (ADR-006 §3/§7 step 5, Amendment 3): a `.voxmod` package's `presets/*.vopreset.json` reuse
# the same on-disk schema and name sanitizer as user-saved module presets.
vox-presets = { path = "../presets" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# T-804: the plugin blocklist's content-hash key (ADR-008 §5) — already a workspace dependency
# (vox-project's sidecar/journal CRCs), no new third-party crate.
crc32fast.workspace = true
# T-805 (ADR-006 §3, ADR-007 amendment): `.voxmod` packages (zip + deflate, pure Rust).
zip.workspace = true
flate2.workspace = true

[dev-dependencies]
vox-module-api = { path = "../module-api", features = ["test-util"] }

[lints]
workspace = true
