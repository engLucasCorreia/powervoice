[package]
name = "vox-project"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
memmap2.workspace = true
crc32fast.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# ADR-001 §2 allows `project -> io` (S1-02: WAV import/save through vox-io's reader/writer).
vox-io = { path = "../io" }
# ADR-001 §4 allows `project -> dsp` ("edit ops incl. normalize gain computation" owns LUFS
# normalize too, S4-01): BS.1770 loudness measurement for the scan pass.
vox-dsp = { path = "../dsp" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# A-010: `GetDiskFreeSpaceExW` for the recording disk floor / remaining-time query (`disk.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
vox-testkit = { path = "../testkit" }

[lints]
workspace = true
