[package]
name = "powervoice-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# T-802 (ADR-008 + Amendment 2): the plugin sandbox process — one per plugin instance. Attaches
# the T-801 segment, loads a plugin through a `PluginBackend` (here: the built-in test backend;
# T-803+ add CLAP/VST3/LV2/JSFX, linked only into this binary, ADR-008 §8), runs the sandbox
# audio thread and answers the host's control requests on stdin/stdout.

[[bin]]
name = "powervoice-sandbox"
path = "src/bin/powervoice-sandbox.rs"

[dependencies]
vox-sandbox-ipc = { path = "../sandbox-ipc" }
vox-module-api = { path = "../module-api" }
# The test backend wraps the built-in Gain, so the proxy path can be compared bit-exactly with
# the in-process module (T-802 acceptance).
vox-modules = { path = "../modules" }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
vox-module-api = { path = "../module-api", features = ["test-util"] }
vox-plugin-host = { path = "../plugin-host" }
vox-rack = { path = "../rack" }
vox-presets = { path = "../presets" }

[lints]
workspace = true
