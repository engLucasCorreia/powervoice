[package]
name = "powervoice-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# T-802 (ADR-008 + Amendment 2): the plugin sandbox process — one per plugin instance. Attaches
# the T-801 segment, loads a plugin through a `PluginBackend` (the built-in test backend and,
# T-803, CLAP; T-806, VST3; LV2/JSFX later — linked only into this binary, ADR-008 §8), runs the sandbox
# audio thread and answers the host's control requests on stdin/stdout. T-803: also
# `--scan <file> --format clap` (enumeration in a disposable process, ADR-008 §6).

[[bin]]
name = "powervoice-sandbox"
path = "src/bin/powervoice-sandbox.rs"

[dependencies]
vox-sandbox-ipc = { path = "../sandbox-ipc" }
vox-module-api = { path = "../module-api" }
# The test backend wraps the built-in Gain, so the proxy path can be compared bit-exactly with
# the in-process module (T-802 acceptance).
vox-modules = { path = "../modules" }
# T-803: the CLAP backend (hand-written CLAP 1.2 bindings; dlopen through libloading, already in
# the tree for the runtime-loaded LAME, ADR-007 §4).
vox-clap-abi = { path = "../clap-abi" }
libloading.workspace = true
serde_json.workspace = true
# T-806 (ADR-007 §6, ADR-008 Amendment 6): the VST3 backend — coupler-rs bindings generated from
# the MIT VST 3 SDK 3.8.0 headers (never `vst3-sys`, GPL).
vst3.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
vox-module-api = { path = "../module-api", features = ["test-util"] }
vox-plugin-host = { path = "../plugin-host" }
vox-rack = { path = "../rack" }
vox-presets = { path = "../presets" }
# T-602: a sandboxed plugin crashing mid-bake (`vox_engine::bake::plan_bake` over a real
# `vox_project` session) — the test needs this crate's sandbox binary.
vox-engine = { path = "../engine", default-features = false }
vox-project = { path = "../project" }
# T-803: the test CLAP plugin (`cdylib`): depending on it makes cargo build the `.so` the tests
# load (`target/<profile>/deps/libvox_test_clap.so`).
vox-test-clap = { path = "../test-clap" }
# T-806: the test VST3 plugin (`cdylib`, `target/<profile>/deps/libvox_test_vst3.so`).
vox-test-vst3 = { path = "../test-vst3" }
serde_json.workspace = true

[lints]
workspace = true
