[package]
name = "powervoice-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "powervoice_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "powervoice-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
# S1-03: native Open/Save/Save As dialogs (ADR-007 Amendment 2, ADR-003 §4.10).
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ts-rs = "12"
anyhow = "1"
# T-104: file logging + crash logs (tracing to a rotating file in the OS state/log dir), and OS
# config/state directory lookup for the settings file and logs. src-tauri-only (CLAUDE.md).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
# S1-01: the audio engine and the built-in modules registered into its rack (composition root).
vox-engine = { path = "../crates/engine" }
vox-modules = { path = "../crates/modules" }
vox-presets = { path = "../crates/presets" }
vox-rack = { path = "../crates/rack" }
# T-802: sandboxed plugins (the editor-side proxy; the format hosts live in `powervoice-sandbox`,
# ADR-008 §8), registered behind the developer flag until T-803+.
vox-plugin-host = { path = "../crates/plugin-host" }
# S1-03: the document service (open/save WAV, peaks) wraps these directly (thin command layer).
vox-project = { path = "../crates/project" }
vox-io = { path = "../crates/io" }
# S4-04: export resampling (`vox_dsp::resample::resample_offline`) and the FTZ/DAZ render guard.
vox-dsp = { path = "../crates/dsp" }
# T-306: fingerprints the just-written save file the same way `vox_project::sidecar` does
# (ADR-004: "CRC uses crc32fast"), by decoding it the way a reader would (SPEC-018 §4.2).
crc32fast = { workspace = true }

[dev-dependencies]
# S1-03: WAV fixtures for the `document` module's tests (dev-only, PROMPT §4).
vox-testkit = { path = "../crates/testkit" }
hound = { workspace = true }
# S4-04: builds a test `RackModel` slot directly (`ModuleRef`/`ModuleState`) in `export`'s tests.
vox-module-api = { path = "../crates/module-api" }

[features]
# Dev-only platform spike (T-007 / ADR-009): renderer + IPC throughput measurements. Off by
# default so `just check` (default features) never builds or lints this code; see `just spike`.
spike = []

[lints]
workspace = true
