[package]
name = "powervoice-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "powervoice_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "powervoice-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
anyhow = "1"

[features]
# Dev-only platform spike (T-007 / ADR-009): renderer + IPC throughput measurements. Off by
# default so `just check` (default features) never builds or lints this code; see `just spike`.
spike = []

[lints]
workspace = true
